<style>

#task{position:absolute;left:0;right:0;bottom:0;height:44px;background:#0c1a20ee;display:flex;align-items:center;gap:12px;padding:0 10px;color:#fff;z-index:9999}

#task .r{margin-left:auto}
#sm{position:absolute;left:8px;bottom:50px;background:#0c1a20;border-radius:10px;padding:8px;z-index:9999;display:flex;flex-direction:column;gap:4px;min-width:200px}
#sm button{background:none;color:#fff;text-align:left;font-weight:400;padding:8px}#sm button:hover{background:#ffffff22}
button,input,select{font:inherit;color:var(--tx);background:var(--w);border:1px solid var(--bd);border-radius:6px;padding:6px 10px}
button{cursor:pointer}button.ac{background:var(--ac);border-color:var(--ac);color:#1c2326;font-weight:700}button.on{border-color:var(--ac);box-shadow:inset 0 -3px var(--ac)}
input{width:150px}.g{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.tabs{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}

.card{border:1px solid var(--bd);background:var(--w);border-radius:8px;padding:10px;margin-bottom:10px}
.mu{color:var(--mu)}.bar{height:6px;background:var(--bd);border-radius:3px;margin:6px 0}.bar i{display:block;height:100%;border-radius:3px}
.chat{display:flex;flex-direction:column;gap:4px;margin:8px 0}.m{padding:6px 10px;border-radius:10px;max-width:80%}.m.b{background:var(--bd)}.m.p{background:var(--ac);color:#1c2326;align-self:flex-end}
.tag{display:inline-block;border:1px solid var(--bd);border-radius:12px;padding:2px 10px;margin:2px;font-size:13px}.big{font-size:22px;font-weight:700}

#start:not(:empty){position:fixed;inset:0;background:#000a;z-index:100000;display:flex;align-items:center;justify-content:center;padding:12px}#start .card{max-height:90vh;overflow:auto;width:min(520px,100%)}
@media(max-width:700px){.win{left:2vw!important;width:96vw}#icons{grid-template-columns:repeat(4,76px)}}
</style></head><body><div id="desk"><div id="icons"></div><div id="wins"></div><div id="start"></div><div id="sm" hidden></div>
<div id="task"><button onclick="sm.hidden=!sm.hidden">⊞ Пуск</button><b id="bal"></b><span id="pn"></span><span class="r" id="clk"></span></div></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,fmt=n=>Math.round(n).toLocaleString('ru-RU')+' ₽',K='autodrom_v1';
const BR=[["BMV F5 M90",7000000],["Cadilac Escalada",10000000],["Mersedes G63 AMD",9000000],["Audy RS7",6500000],["Porshe 911 Turbo",12000000],["Toyoto Camri",2500000],["Toyoto Land Cruser",6000000],["Hynday Solyaris",1100000],["Kya Rio",1000000],["Nisan Qashkay",2000000],["Volksvagen Polo",1200000],["Skoda Oktavya",1800000],["Fard Mustang",5000000],["Shevrole Niva",700000],["Lada Granta",600000],["Жыгули 2107",250000],["Lexsus LX600",11000000],["Hondo Accord",2100000],["Mazdo CX-5",2300000],["Tesia Model S",8000000],["Range Rovar Sport",9500000],["Lade Vesta",1400000],["Lade Niva Legend",900000],["Lade Largus",1200000],["Lade XRAY",1100000],["Moskvitch 3",1700000],["Moskvitch 6",2500000],["Moskvitch 2141",90000],["UAS Patriot",1800000],["UAS Hunter",1300000],["UAS Pickap",1600000],["GAS Gazelle Next",2300000],["GAS Sobol",1900000],["GAS Volga 24",150000],["Volga Siber",500000],["Auras Senat",18000000],["Oca 1111",60000],["Izh Oda",80000],["Cherry Tiggo 7",2200000],["Havol H9",3500000],["Gealy Coolray",1800000],["BYT Han",4000000],["Lifen X60",800000],["Bentlay Continental",15000000],["Lamborgini Urus",25000000],["Ferary Roma",22000000],["Maserati Ghiblie",9000000],["Volvu XC90",6000000],["Subaro Forester",3000000],["Jeap Wrangler",5000000],["Dodg Ram",6000000],["Mitsubishy Lanser",1500000],["Opell Astra",900000]];
const RD='Telsa Roadster',CN=['Cherry Tiggo 7','Havol H9','Gealy Coolray','BYT Han','Lifen X60'];
const CITY0=[{co:'Россия',n:'Москва',tx:3,sup:1.6,pm:1.15,sz:0},{co:'Россия',n:'Санкт-Петербург',tx:3,sup:1.3,pm:1.1,sz:0},{co:'Россия',n:'Новосибирск',tx:4,sup:1,pm:1,sz:1},{co:'Россия',n:'Владивосток',tx:5,sup:.5,pm:.9,sz:2},{co:'Беларусь',n:'Минск',tx:2,sup:1,pm:.95,sz:1},{co:'Казахстан',n:'Алматы',tx:3,sup:.9,pm:.9,sz:1},{co:'ОАЭ',n:'Дубай',tx:1,sup:1.4,pm:1.25,sz:0},{co:'Китай',n:'Шанхай',tx:2,sup:1.5,pm:.8,sz:0},{co:'Германия',n:'Берлин',tx:6,sup:1.2,pm:1.1,sz:1},{co:'США',n:'Нью-Йорк',tx:7,sup:1.3,pm:1.3,sz:0}];
const CITY='Россия|Москва|3|1.6|1.15|0;Россия|Санкт-Петербург|3|1.3|1.1|0;Россия|Новосибирск|4|1|1|1;Россия|Владивосток|5|.5|.9|2;Беларусь|Минск|2|1|.95|1;Казахстан|Алматы|3|.9|.9|1;ОАЭ|Дубай|1|1.4|1.25|0;Китай|Шанхай|2|1.5|.8|0;Германия|Берлин|6|1.2|1.1|1;США|Нью-Йорк|7|1.3|1.3|0;Россия|Казань|4|1|1|1;Россия|Екатеринбург|4|1.1|1|1;Россия|Сочи|4|.8|1.05|1;Россия|Краснодар|4|.9|1|1;Россия|Нижний Новгород|4|.9|.95|1;Россия|Самара|4|.8|.95|1;Россия|Хабаровск|5|.5|.9|2;Беларусь|Гродно|2|.5|.9|2;Казахстан|Астана|3|.9|.95|1;ОАЭ|Абу-Даби|1|1.2|1.2|0;Китай|Пекин|3|1.5|.85|0;Китай|Гуанчжоу|2|1.3|.75|0;Германия|Мюнхен|6|1.2|1.15|1;Германия|Гамбург|6|1|1.05|1;США|Лос-Анджелес|7|1.4|1.3|0;США|Майами|6|1.1|1.2|1;США|Чикаго|7|1.1|1.15|1;Япония|Токио|4|1.5|1.2|0;Япония|Осака|4|1|1.1|1;Япония|Нагоя|4|.7|1.05|2;Южная Корея|Сеул|4|1.3|1.1|0;Турция|Стамбул|5|1.3|.85|0;Турция|Анталья|5|.7|.8|1;Грузия|Тбилиси|2|.6|.85|2;Армения|Ереван|2|.6|.85|2;Узбекистан|Ташкент|3|.8|.8|1;Франция|Париж|6|1.3|1.2|0;Франция|Ницца|6|.7|1.15|1;Италия|Рим|6|1.1|1.1|1;Италия|Милан|6|1.3|1.15|0;Великобритания|Лондон|7|1.4|1.3|0;Канада|Торонто|6|1.2|1.15|0;Бразилия|Сан-Паулу|6|1.1|.85|1;Индия|Дели|5|1.2|.7|1;Таиланд|Бангкок|4|1|.75|1'.split(';').map(s=>{const a=s.split('|');return{co:a[0],n:a[1],tx:+a[2],sup:+a[3],pm:+a[4],sz:+a[5]}});
const bad=()=>S.viol>=3?(toast('3 нарушения: покупки, кредиты и переезд запрещены'),1):0,cap=()=>2+5*S.gars.filter(g=>g.city==S.city&&(!g.end||g.end>Date.now())).length;
const carSVG=c=>{let h=0;for(const ch of c.n)h=(h*31+ch.charCodeAt(0))%360;const t=c.tn||{},col=t.paint||`hsl(${h},55%,45%)`,suv=/Land|Patriot|Niva|Wrang|Ram|Urus|Escal|Range|Hunter|Pickap|XC90|Forest|Tiggo|H9|X60|G63/.test(c.n),y=suv?14:20;return `<svg viewBox="0 0 200 80" width=220><path d="M10 55V42Q14 36 40 34L${suv?60:70} ${y}H${suv?150:130}L${suv?170:150} 34Q190 38 192 48V55Z" fill="${col}"/><path d="M${suv?66:76} ${y+4}H${suv?144:124}L145 34H55Z" fill="${t.tint?'#112':'#bfe3f5'}"/>${t.sp?'<path d="M8 36h24v-6H8z" fill="#222"/>':''}<circle cx=50 cy=56 r=13 fill="#222"/><circle cx=150 cy=56 r=13 fill="#222"/><circle cx=50 cy=56 r=6 fill="${t.rim?'#e8a400':'#999'}"/><circle cx=150 cy=56 r=6 fill="${t.rim?'#e8a400':'#999'}"/></svg>`};
const TN=[['st','Стерео',1.5],['sp','Спойлер',2],['rim','Диски',2],['tint','Тонировка',.5]],PC=['#d94a4a','#2e6fd9','#222222','#eeeeee','#e8a400','#2e9d5b'];
const tb=c=>{const t=c.tn||{};return .03*(!!t.st+!!t.sp+!!t.rim+!!t.tint)+(t.paint?0.02:0)};
const tc=(c,k)=>Math.max(15000,Math.round(c.base*(k=='paint'?1:TN.find(x=>x[0]==k)[2])/100/1000)*1000);
const tuneB=c=>TN.map(x=>`<button onclick="tune(${c.id},'${x[0]}')">${(c.tn||{})[x[0]]?'✔ ':''}${x[1]} ${fmt(tc(c,x[0]))}</button>`).join('')+PC.map(h=>`<button style="background:${h};width:28px;height:28px;padding:0" onclick="tune(${c.id},'paint','${h}')" title="Покраска ${fmt(tc(c,'paint'))}"></button>`).join('')+(S.salon?`<button onclick="toStore(${c.id})">В автосалон</button>`:'');
function tune(id,k,v){const c=S.garage.find(x=>x.id==id);c.tn=c.tn||{};if(k!='paint'&&c.tn[k])return toast('Уже установлено');const p=tc(c,k);if(S.money<p)return toast('Не хватает денег');S.money-=p;c.tn[k]=v||1;if(k=='st')try{const a=new AudioContext(),o=a.createOscillator();o.connect(a.destination);o.start();setTimeout(()=>o.stop(),300)}catch(e){}R()}
function toStore(id){const c=S.garage.find(x=>x.id==id);if(S.salon.st.length>=10)return toast('Салон полон (10 машин)');S.garage=S.garage.filter(x=>x!=c);S.salon.st.push(c);R()}
function rEst(){const pm=CI().pm,gp=Math.round(1.5e6*pm/1e3)*1e3,sp=Math.round(25e6*pm/1e3)*1e3;return `<p class=mu>${CI().n}: цены ×${pm}. Гараж: ${S.garage.length}/${cap()} мест (базово 2, +5 за каждый гараж в этом городе)</p><div class=card><b>Гараж на 5 машин</b><div class=g><button onclick="est('g',1)">Купить ${fmt(gp)}</button><button onclick="est('g',0)">Аренда 30 мин ${fmt(gp*.06)}</button></div><span class=mu>Мои: ${S.gars.map(g=>CITY[g.city].n+(g.end?' (аренда)':'')).join(', ')||'нет'}</span></div><div class=card><b>Автосалон</b>${S.salon?`<p>Ваш салон: ${CITY[S.salon.city].n}${S.salon.end?', аренда: <span class=cd data-t="${S.salon.end}"></span>':''}. Управление — в «Бизнесе».</p>`:`<div class=g><button onclick="est('s',1)">Купить ${fmt(sp)}</button><button onclick="est('s',0)">Аренда 30 мин ${fmt(sp*.04)}</button></div>`}</div>`}
function est(k,buy){if(bad())return;const p=(k=='g'?1.5e6:25e6)*CI().pm*(buy?1:k=='g'?.06:.04);if(S.money<p)return toast('Не хватает денег');S.money-=Math.round(p);const o={city:S.city,end:buy?0:Date.now()+18e5};if(k=='g')S.gars.push(o);else S.salon={...o,st:[],sel:0,ad:0,ni:Date.now()+9e5,ip:0,ex:0,fx:0};R()}
function rBiz(){const A=S.salon;if(!A)return'<p>Нет автосалона. Купите или арендуйте его в «Недвижимости».</p>';const K=S.contract;return `<div class=card><b>Автосалон: ${CITY[A.city].n}</b> · машин ${A.st.length}/10 · покупателей в минуту ≈ ${(.3+.2*A.sel+.3*A.ad).toFixed(1)} · продавцов ${A.sel}/5 · реклама ${A.ad}/3<div class=g><button onclick="biz('h')">Нанять продавца 150 000 ₽</button><button onclick="biz('a')">Реклама ${fmt(2e5*(A.ad+1))}</button><button onclick="biz('x')">Аварийный выход ${A.ex?'✔':'300 000 ₽'}</button><button onclick="biz('f')">Огнетушители ${A.fx?'✔':'200 000 ₽'}</button></div><p class=mu>Машины в салоне продаются на 12%+ дороже рынка. Проверка раз в 15 минут: без выхода и огнетушителей штраф 20% заработка.</p>${A.ip?`<div class=g><b>Проверка!</b><button onclick="insp(0)">Дать взятку 500 000 ₽</button><button onclick="insp(1)">Провести проверку</button></div>`:''}</div><div class=card><b>Контракты</b>${K?`<p>${K.brand}: осталось <span class=cd data-t="${K.end}"></span>, к выплате ${fmt(K.owed)}${K.pen?' (штраф +20% за непроданные)':' (без штрафа)'}</p>`:`<p class=mu>Бренд даёт 10 машин в салон на 20 минут. За проданные платите 85% цены. Не успели — машины возвращаются и штраф +20% за непроданные. Салон должен быть пуст.</p><div class=g><select id=cb>${['BMV','Audy','Toyoto','Lade','Cherry','Hynday'].map(b=>`<option>${b}</option>`).join('')}</select><button onclick="ctr(1)">Контракт</button><button onclick="ctr(0)">Без штрафа (+8%)</button></div>`}</div><div class=card><b>Своя марка</b>${S.brand?`<p>${S.brand}</p><button onclick="asm()">Собрать машину 600 000 ₽ (2 мин)</button>`:`<div class=g><input id=bn placeholder="Название марки"><button onclick="lic()">Купить лицензию 5 000 000 ₽</button></div>`}</div>`}
function biz(k){const A=S.salon,c={h:15e4,a:2e5*(A.ad+1),x:3e5,f:2e5}[k];if(k=='h'&&A.sel>=5||k=='a'&&A.ad>=3||k=='x'&&A.ex||k=='f'&&A.fx)return toast('Уже максимум');if(S.money<c)return toast('Не хватает денег');S.money-=c;if(k=='h')A.sel++;if(k=='a')A.ad++;if(k=='x')A.ex=1;if(k=='f')A.fx=1;R()}
function ctr(pen){const A=S.salon,b=$('#cb').value;if(bad())return;if(S.contract||A.st.length)return toast('Салон должен быть пуст, контракт один');const bs=BR.filter(x=>x[0].startsWith(b)),cs=[];for(let i=0;i<10;i++){const c=mk(null,bs[rnd(0,bs.length-1)]);c.ct=1;c.cc=Math.round(pr(c)*.85);cs.push(c)}const fee=pen?0:Math.round(cs.reduce((a,c)=>a+c.cc,0)*.08);if(S.money<fee)return toast('Не хватает денег');S.money-=fee;A.st=cs;S.contract={brand:b,end:Date.now()+12e5,owed:0,pen};R()}
function insp(m){const A=S.salon;if(!A)return;if(m==0){if(S.money<5e5)return toast('Нужно 500 000 ₽');S.money-=5e5;if(Math.random()<.4){S.money-=1e6;S.noSell=Date.now()+3e5;toast('Инспектор неподкупен: арест, штраф 1 000 000 ₽, продажи остановлены на 5 мин')}else toast('Взятка принята')}else if(!A.ex||!A.fx){const f=Math.round(S.earn*.2);S.money-=f;toast('Нет выхода или огнетушителей: штраф '+fmt(f))}else toast('Проверка пройдена');S.earn=0;A.ni=Date.now()+9e5;A.ip=0;R()}
function lic(){const n=$('#bn').value.trim();if(!n)return toast('Введите название');if(S.money<5e6)return toast('Не хватает денег');S.money-=5e6;S.brand=n;R()}
function asm(){if(S.money<6e5)return toast('Не хватает денег');S.money-=6e5;S.ship.push({t:'in',end:Date.now()+12e4,car:{id:S.id++,n:S.brand+' '+rnd(1,9),base:1.6e6,c:100,iss:[],sel:'—',maxd:5,ins:{},chat:[],bp:6e5}});toast('Сборка началась');R()}
function rBm(){return `<p class=mu>Нелегальный рынок. Деньги из кейсов — грязные: при обыске автосалона их изымают.</p><div class=card><b>Кейс с промокодом</b> <span class=mu>10 000–10 000 000 ₽ или 100–100 000 в валюте</span><div class=g><button onclick="bmc(0)">За 1 000 000 ₽</button><button onclick="bmc(1)">За $12 000</button></div></div><div class=card><b>Промокод «снять нарушение»</b> 3 000 000 ₽ · риск 25%: запрет продаж на 5 минут<div class=g><button onclick="bmv()">Купить</button></div></div>`}
function bmc(u){if(u?S.cur.USD<12e3:S.money<1e6)return toast('Не хватает средств');u?S.cur.USD-=12e3:S.money-=1e6;const k=Object.keys(S.fx);S.codes.push(Math.random()<.7?{cur:'RUB',amt:Math.round(10**(4+Math.random()*3)/1e3)*1e3}:{cur:k[rnd(0,k.length-1)],amt:Math.round(10**(2+Math.random()*3))});toast('Кейс куплен — код в Банке');R()}
function bmv(){if(S.money<3e6)return toast('Не хватает денег');S.money-=3e6;if(Math.random()<.25){S.noSell=Date.now()+3e5;toast('Вас засекли! Продажи запрещены на 5 минут')}else if(S.viol){S.viol--;toast('Нарушение снято')}else toast('Нарушений нет, деньги потеряны');R()}
function rCodes(){return S.codes.length?`<div class=card><b>Промокоды из кейсов</b>${S.codes.map((c,i)=>`<div class=row><span>Код №${i+1}</span><button onclick="acc(${i})">Активировать</button></div>`).join('')}</div>`:''}
function acc(i){const c=S.codes.splice(i,1)[0];if(c.cur=='RUB'){S.money+=c.amt;S.dirty+=c.amt}else S.cur[c.cur]+=c.amt;toast('Получено: '+c.amt.toLocaleString('ru-RU')+' '+c.cur);R()}
function rReset(){return `<div class=card><b>Сброс прогресса</b><p class=mu>Удалит всё. Старт заново с 1 000 000 ₽ и выбором города.</p><button onclick="rs()">${['Сбросить прогресс','Да','Согласен'][V.rs|0]}</button> ${V.rs?'<button onclick="V.rs=0;R()">Отмена</button>':''}</div>`}

function bp(n){const b=BR[V.shopB],p=ppr(b);if(S.money<p)return toast('Не хватает денег');S.money-=p;S.inv.push({b:b[0],part:n});R()}
/* НАСТРОЙКИ */
function rSet(){return `<div class=card><b>Сохранение прогресса</b><p class=mu><b>Как это работает:</b> нажмите «Выдать код», скопируйте весь текст из поля (можно сохранить в .txt). Чтобы продолжить игру, вставьте код в поле и нажмите «Загрузить из поля» или выберите .txt-файл. Код не расходуется: его можно использовать сколько угодно раз, он хранит прогресс на момент выдачи. При 3 нарушениях сохранение и загрузка недоступны.</p><div class=g><button onclick="gc()">Выдать код прогресса</button><button onclick="load($('#pg').value.trim())">Загрузить из поля</button><input type=file onchange="lf(this)" accept=".txt,.json"></div><textarea id=pg rows=3 style="width:100%"></textarea></div><div class=card><b>Промокод</b><div class=g><input id=pc placeholder="Промокод"><button class=ac onclick="promo()">Активировать</button></div></div>${rReset()}`}
function promo(){const v=$('#pc').value.trim();if(v=='7777'){if(S.p7)return toast('Промокод уже использован');if(!S.viol)return toast('Нарушений нет');S.p7=1;S.viol--;toast('Нарушение снято');return R()}if(v!='1234')return toast('Неверный промокод');if(S.promo)return toast('Промокод уже использован');S.promo=true;S.money+=1e6;toast('+1 000 000 ₽');R()}
/* ОС */
const APPS={bank:['🏦','Банк',rBank],auto:['🚗','Автодром',rAuto],gar:['🔧','Гараж',rGar],shop:['🛒','Магазин деталей',rShop],est:['🏠','Недвижимость',rEst],biz:['💼','Бизнес',rBiz],bm:['🕶️','Чёрный рынок',rBm],move:['✈️','Переезд',rMove],kit:['🇨🇳','Китадром',rKit],set:['⚙️','Настройки',rSet]};
$('#icons').innerHTML=Object.keys(APPS).map(k=>`<button class=ic onclick="op('${k}')"><span>${APPS[k][0]}</span>${APPS[k][1]}</button>`).join('');
$('#sm').innerHTML=Object.keys(APPS).map(k=>`<button onclick="op('${k}')">${APPS[k][0]} ${APPS[k][1]}</button>`).join('');
function op(id){const n=Object.keys(W).length;W[id]=W[id]||{x:110+n*28,y:20+n*28};W[id].z=++Z;$('#sm').hidden=true;R()}
function cl(id){delete W[id];R()}
function updCd(){const n=Date.now();document.querySelectorAll('.cd').forEach(e=>{const s=Math.max(0,Math.round((e.dataset.t-n)/1000));e.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')})}
function R(){$('#wins').innerHTML=Object.keys(W).map(id=>`<div class=win style="left:${W[id].x}px;top:${W[id].y}px;z-index:${W[id].z}"><div class=tb data-id=${id}><span>${APPS[id][0]} ${APPS[id][1]}</span><b onclick="cl('${id}')">×</b></div><div class=bd>${APPS[id][2]()}</div></div>`).join('');$('#bal').textContent=fmt(S.money)+' · '+CI().n+(S.viol?' · ⚖ '+S.viol+'/3':'');$('#pn').innerHTML=S.taxDl?`<span style="background:#d44a3a;padding:3px 8px;border-radius:6px">⚠ Налог ${fmt(S.tax)}: <span class=cd data-t="${S.taxDl}"></span></span>`:'';$('#start').innerHTML=S.city==null?rStart():'';updCd();save()}
function tick(){const n=Date.now();let ch=0;
if(n>=S.m.n){refM('m',6,3e5);V.car=V.tab=='m'?null:V.car;ch=1}if(n>=S.d.n){refM('d',6*rnd(10,20),6e5);V.car=V.tab=='d'?null:V.car;ch=1}
const k=Math.floor((n-S.lt)/6e4);if(k>0){S.light+=1500*k;S.lt+=k*6e4;ch=1}
if(n>=S.fxn){S.pf={...S.fx};for(const f in S.fx)S.fx[f]=Math.max(1,S.fx[f]*(1+rnd(-70,70)/1000));S.fxn=n+6e5;ch=1}
if(S.trip&&n>=S.trip.end){if(S.trip.x){S.ban.push(CI().co);S.viol=0}S.city=S.trip.city;S.trip=null;refM('m',6,3e5);refM('d',6*rnd(10,20),6e5);V.car=null;ch=1}
S.ship=S.ship.filter(s=>{if(n<s.end)return 1;if(s.t=='out'){S.money+=s.pay;toast('Доставка завершена: +'+fmt(s.pay))}else{let c=s.car;if(s.kit){do{c=mk(null,s.b)}while(s.ok?c.c<70:c.c>20);c.base=s.b[1];c.bp=s.paid;c.kit=1}S.garage.push(c);toast(c.n+' доставлена в Гараж')}ch=1;return 0});
const SA=S.salon;
if(S.tax>3e5&&!S.taxDl){S.taxDl=n+6e5;toast('⚠ Налоговая: налог выше 300 000 ₽. Погасите долг за 10 минут!');ch=1}
if(S.taxDl&&S.tax<=3e5){S.taxDl=null;ch=1}
if(S.taxDl&&n>=S.taxDl){S.garage=[];S.list=[];if(SA)SA.st=[];S.ship=S.ship.filter(s=>s.t=='out');S.tax=0;S.taxDl=null;S.viol++;toast('Государство изъяло все машины. Нарушений: '+S.viol+'/3');ch=1}
if(SA&&SA.end&&n>SA.end){S.garage.push(...SA.st);S.salon=null;toast('Аренда автосалона закончилась');ch=1}
else if(SA){if(S.noSell<n&&SA.st.length&&Math.random()<(.3+.2*SA.sel+.3*SA.ad)/60){const c=SA.st.splice(rnd(0,SA.st.length-1),1)[0],p=Math.round(pr(c)*(1.12+.02*SA.sel));S.money+=p;S.earn+=p;S.tax+=Math.round(p*(.05+CI().tx/100));if(c.ct)S.contract.owed+=c.cc;toast(c.n+' продана в автосалоне за '+fmt(p));ch=1}
const K=S.contract;if(K&&(n>=K.end||!SA.st.some(c=>c.ct))){const un=SA.st.filter(c=>c.ct),due=K.owed+(K.pen?Math.round(un.reduce((a,c)=>a+c.cc,0)*.2):0);SA.st=SA.st.filter(c=>!c.ct);S.money-=due;if(S.money<0){S.debt+=-S.money;S.money=0}S.contract=null;toast('Контракт закрыт. Поставщику выплачено '+fmt(due));ch=1}
if(n>=SA.ni&&!SA.ip){SA.ip=n+18e4;toast('🕵 Проверка в автосалоне! Решите в «Бизнесе»');ch=1}
if(SA.ip&&n>=SA.ip)insp(1);
if(S.dirty>0&&Math.random()<1/900){const m=Math.min(S.money,S.dirty);S.money-=m;const f=Math.round(S.money*.5);S.money-=f;S.dirty=0;toast('Обыск: изъято '+fmt(m)+' грязных денег, штраф '+fmt(f));ch=1}}
S.list.slice().forEach(L=>{if(!L.b&&n>=L.nx){spawn(L);ch=1}});
$('#clk').textContent=new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});if(ch)R();else updCd()}
document.addEventListener('pointerdown',e=>{const t=e.target.closest('.tb');if(!t||e.target.tagName=='B')return;const w=W[t.dataset.id];w.z=++Z;t.parentElement.style.zIndex=Z;D={w,el:t.parentElement,dx:e.clientX-w.x,dy:e.clientY-w.y}});
addEventListener('pointermove',e=>{if(!D)return;D.w.x=Math.max(0,e.clientX-D.dx);D.w.y=Math.max(0,e.clientY-D.dy);D.el.style.left=D.w.x+'px';D.el.style.top=D.w.y+'px'});
addEventListener('pointerup',()=>D=null);
setInterval(tick,1000);tick();R();
</script></body></html>
